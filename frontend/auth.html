<!doctype html>
<html lang="en">
<link rel="stylesheet" href="auth-landing.css?v=1">
<script defer src="auth-landing.js?v=2"></script>
<script defer src="silk.js?v=2"></script>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HERA | Sign in</title><link rel="icon" href="assets/HERA_LOGO.jpg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}[hidden]{display:none!important}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;font-family:Poppins,sans-serif;color:#35131f;background:radial-gradient(circle at top,#ffe9f1,#f9f4f6 55%)}main{width:min(440px,100%);padding:38px;border:1px solid #efdce3;border-radius:28px;background:#fff;box-shadow:0 24px 80px #6b173226}.brand{display:flex;align-items:center;gap:12px;margin-bottom:30px;font-size:24px;font-weight:700}.brand img{width:52px;height:52px;border-radius:50%}h1{margin:0 0 8px;font-size:30px}p{color:#765864}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:24px 0;padding:5px;border-radius:14px;background:#f9edf1}.tabs button{padding:11px;border:0;border-radius:10px;font:600 14px inherit;color:#765864;background:transparent}.tabs button.active{color:#fff;background:#8b002f}form{display:grid;gap:16px}label{display:grid;gap:7px;font-size:13px;font-weight:600}input{width:100%;padding:13px 14px;border:1px solid #ddcbd2;border-radius:12px;font:inherit}form button{padding:14px;border:0;border-radius:12px;font:600 15px inherit;color:#fff;background:#8b002f;cursor:pointer}.status{min-height:22px;margin:4px 0 0;color:#a00035;font-size:13px}.note{margin-top:24px;font-size:12px;line-height:1.6}</style></head>
<body><main><div class="brand"><img src="assets/HERA_LOGO.jpg" alt="">HERA</div><h1 id="title">Welcome back</h1><p id="subtitle">Sign in to your private health space.</p><div class="tabs"><button id="login-tab" class="active" type="button">Sign in</button><button id="register-tab" type="button">Create account</button></div><form id="auth-form"><label id="name-field" hidden>Name<input name="name" minlength="2" maxlength="60" autocomplete="name"></label><label>Email<input name="email" type="email" maxlength="254" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="10" maxlength="128" autocomplete="current-password" required></label><button id="submit" type="submit">Sign in</button><p class="status" id="status" role="status"></p></form><p class="note">Health data stays tied to your account. HERA provides informational wellness support, not diagnosis or emergency care.</p></main><script>const form=document.querySelector('#auth-form'),nameField=document.querySelector('#name-field'),status=document.querySelector('#status');let mode=location.pathname==='/register'?'register':'login';function show(next){mode=next;const register=mode==='register';nameField.hidden=!register;nameField.querySelector('input').required=register;document.querySelector('#title').textContent=register?'Create your HERA account':'Welcome back';document.querySelector('#subtitle').textContent=register?'Start a private health space.':'Sign in to your private health space.';document.querySelector('#submit').textContent=register?'Create account':'Sign in';document.querySelector('#login-tab').classList.toggle('active',!register);document.querySelector('#register-tab').classList.toggle('active',register);form.password.autocomplete=register?'new-password':'current-password';history.replaceState(null,'',register?'/register':'/login');status.textContent=''}document.querySelector('#login-tab').onclick=()=>show('login');document.querySelector('#register-tab').onclick=()=>show('register');form.onsubmit=async e=>{e.preventDefault();status.textContent=mode==='register'?'Creating account…':'Signing in…';const body=Object.fromEntries(new FormData(form));try{const response=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await response.json();if(!response.ok)throw new Error(data.error||'Request failed');location.href='/homepage'}catch(error){status.textContent=error.message}};show(mode)</script></body></html>
